# 字段路由表 v1 — QuantMind 多市场多数据源平台
#
# 每个 market(A/HK/US) 下按 field 列出 primary + fallbacks。
# - primary  : 默认拉取源
# - fallbacks: primary 失败 / 触发限流时按顺序尝试
# - consensus: 是否需要多源共识投票（适用于关键价格字段）
# - cleanup  : 是否走 DataCleaner 4 层清洗
# - tier     : T1=离线日级 / T2=分钟 / T3=实时报价 / T4=逐笔订单流 / T5=资金流
#
# 数据源名必须与 backend/services/engine/data_platform/adapters/ 注册名一致。

version: 1
default_consensus_threshold: 0.02   # 2% 偏离视为异常
default_min_consensus_sources: 2

markets:
  # ===================================================================
  # A 股
  # ===================================================================
  A:
    daily_kline:
      tier: T1
      primary: baostock
      fallbacks: [efinance, qstock, akshare, investment_data, tdx_api, mootdx, openbb, yahoo_finance, eltdx, simonlin_a_stock]
      consensus: true
      cleanup: true
